<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="supported-color-schemes" content="light">
</head>
<body style="margin:0;padding:0;background-color:#F5F8FD;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#EEF4FC;background-image:linear-gradient(180deg,#E3EEFC 0%,#F5F8FD 100%);padding:44px 16px;">
    <tr>
      <td align="center">

        <!-- Logo -->
        <table role="presentation" cellpadding="0" cellspacing="0" style="margin-bottom:24px;">
          <tr>
            <td style="padding-right:10px;vertical-align:middle;">
              <img src="https://whatyouate.app/icon-512.png" width="34" height="34" alt="" style="display:block;border-radius:9px;border:0;">
            </td>
            <td style="vertical-align:middle;font-size:19px;font-weight:600;letter-spacing:-0.3px;color:#1F2937;white-space:nowrap;">WhatYouAte<span style="display:inline-block;font-size:6.6px;line-height:1;font-weight:600;color:#1F2937;opacity:0.6;vertical-align:top;padding-top:5px;margin-left:1px;">AI</span></td>
          </tr>
        </table>

        <!-- Card -->
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:440px;background-color:#ffffff;border-radius:22px;box-shadow:0 18px 40px -26px rgba(16,42,86,0.30);">
          <tr>
            <td style="padding:34px 34px 30px 34px;">
              <p style="margin:0 0 10px 0;font-size:22px;font-weight:700;letter-spacing:-0.5px;color:#16233B;">Here&rsquo;s your code</p>
              <p style="margin:0 0 26px 0;font-size:15.5px;line-height:1.6;color:#5B6B85;">
                Enter it in WhatYouAte to continue. It works once and expires in 1 hour.
              </p>
              <div style="background-color:#EEF5FE;border:1.5px solid #B9D4FA;border-radius:16px;padding:18px 10px;text-align:center;font-size:32px;font-weight:700;letter-spacing:6px;color:#16233B;">{{ .Token }}</div>
              <p style="margin:26px 0 0 0;font-size:13.5px;line-height:1.6;color:#8FA3C0;">
                Didn&rsquo;t ask for this? You can ignore this email. The code expires on its own.
              </p>
            </td>
          </tr>
        </table>

        <!-- Footer -->
        <p style="margin:22px 0 0 0;font-size:12.5px;color:#8FA3C0;">
          <a href="https://whatyouate.app" style="color:#8FA3C0;text-decoration:none;">whatyouate.app</a>
        </p>

      </td>
    </tr>
  </table>
</body>
</html>
