<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body style="margin:0;padding:0;background-color:#F8FAFC;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;">
  <table width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8FAFC;padding:40px 20px;">
    <tr>
      <td align="center">
        <table width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background-color:#ffffff;border-radius:16px;padding:40px;box-shadow:0 1px 4px rgba(0,0,0,0.06);">

          <!-- Logo / App Name -->
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <span style="font-size:22px;font-weight:700;color:#1F2937;">WhatYouAte</span>
            </td>
          </tr>

          <!-- Heading -->
          <tr>
            <td style="padding-bottom:12px;">
              <p style="margin:0;font-size:20px;font-weight:600;color:#1F2937;">Your code</p>
            </td>
          </tr>

          <!-- Body text -->
          <tr>
            <td style="padding-bottom:28px;">
              <p style="margin:0;font-size:15px;color:#6B7280;line-height:1.6;">
                Enter this code in WhatYouAte to continue. It expires in 1 hour and can only be used once.
              </p>
            </td>
          </tr>

          <!-- Code -->
          <tr>
            <td align="center" style="padding-bottom:32px;">
              <div style="display:inline-block;background-color:#F1F5F9;border-radius:12px;padding:18px 32px;font-size:34px;font-weight:700;letter-spacing:8px;color:#1F2937;">
                {{ .Token }}
              </div>
            </td>
          </tr>

          <!-- Divider -->
          <tr>
            <td style="border-top:1px solid #F1F5F9;padding-top:24px;">
              <p style="margin:0;font-size:13px;color:#9CA3AF;line-height:1.6;">
                If you didn't request this email you can safely ignore it. This code will expire on its own.
              </p>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>
</body>
</html>
